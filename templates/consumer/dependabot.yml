# Copy to <your-repo>/.github/dependabot.yml
version: 2
updates:
  - package-ecosystem: pip        # also covers pyproject.toml / poetry / uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
